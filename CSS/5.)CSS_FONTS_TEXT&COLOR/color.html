<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
    <style>
        h1 {
            /* color: red; */
            /* color: #034902; Hexadecimal color code */
            /* color: rgb(16, 31, 142); RGB color code */

            background-color: rgb(13, 8, 163);   
            
        }

        Color can be represented in:

            <li>HSL</li>
        </ol>
    </p>
