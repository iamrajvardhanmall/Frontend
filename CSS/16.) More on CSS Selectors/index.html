        /* .box:nth-last-child(1) {

        /* Using before and after we can insert content dynamically */
        .boxes::before {
            content: "I am Raj, Hello!";
            /* These content are known as pseudo-elements */
            color: green;
        }

        .boxes::after {
            content: "I am Raj, Hello!";
            color: red;
        }

        /* ::selection is used to style the selected text */
        .boxes::selection {
            background-color: blue;
            color: pink;
        }

        .box::first-letter {
            font-size: 2em;
            color: purple;
        }

        input::placeholder {
            color: red;
            font-weight: bold;
            font-size: 70px;
        }
    </style>
</head>

<body> 
    <div class="boxes">
        <div data-color="primary" class="box">I am box 1</div>
        <div class="box">Hey I am Sam</div>
        <div class="box">Hey I am Alex</div>
        <input type="text" placeholder="Type your name here">
    </div>
</body>
