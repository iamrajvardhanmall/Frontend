<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>

        * {
            margin: 0;
            padding: 0;
        }
        .box {
            border: 2px solid black;
            display: inline-block;  
            padding: 45px;
            margin: 34px;
        }
        .box1 {
            display: none; /* This will completely remove the element from the document flow */
            visibility: hidden;  /* This will hide the element i.e.., it will take up space but will not be visible */
        }
    </style>
</head>

<body>
    <!-- https://developer.mozilla.org/en-US/docs/Web/CSS/display -->
    <div class="box box1">
        I am a box

    </div>
    <div class = "box">
        also a nice box
    </div>
<span>
    I am s good
</span>
<span>
    Body
</span>
</body>

</html>
