<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>CSS Selector</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Element Selector */
      /* div {
                background-color: red;
            } */

      /* Class Selector */
      .red {
        background-color: blue;
      }

      /* ID Selector */
      #blue {
        background-color: yellow;
      }

      /* Child Selector */
      div > p {
        color: blue;
        background-color: blue;
      }

      /* Descendant Selector */
      div p {
        color: red;
        background-color: red;
      }

      /* Universal Selector */
      * {
        margin: 0px;
        padding: 0px;
      }

      /* Pseudo Selectors */
      a:visited { /* This means visited links becomes pink */
        color: pink;
      }

      a:link {  /* a:link means all links are in green color */
        color: green;
      }

      a:active {  /* a:active means the link is being clicked/active */
        color: orange;
      }

      a:hover {  /* a:hover means the link is being hovered over */
        color: purple;
      }

      /* First child Pseudo Selector */
      p:first-child {   /* This means are first p of div will become aqua */
        background-color: aqua;
      }

      
    </style>
  </head>
  <body>
    <div class="red">
      I am a div element.
      <article>
        <p>I am a paragraph element.</p>
      </article>
    </div>

    <div id="blue">
      I am an id element.
      <p>I am a paragraph element.</p>
    </div>

    <a href="www.google.com">Go to Google</a>
    <a href="ww.facebook.com">Go to Facebook</a>

    <div class="one">
        <p> I am first child</p>
        <p> I am second child</p>
    </div>
    <script src="" async defer></script>
  </body>
</html>
