<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>CSS Box Model</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="" />
    <style>
      .box {
        background-color: lightblue;
      }

      .box1 {
        color: yellow;
        padding: 20px;
        margin: 25px;
        border: 1px solid black;
        height: 200px;
        box-sizing: border-box;  /* border-box makes the width and height include the padding and border = 200px (NOT Margin) */
      }

      /*
      Concept of Margin Collapse: When two or more adjacent boxes have a margin, only the maximum margin is added to the bottom box. This is called margin collapsing.
      */

      .box2 {
        border: red;
        padding: 20px;
        margin: 25px;
        border: 1px solid red;
        height: 200px;
        box-sizing: border-box;
      }

      * {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!-- Box Model -->
    <!-- The box model is a fundamental concept in CSS, which defines how HTML elements are rendered on a webpage. It consists of the content area, padding, border, and margin. -->
    <div class="box box1">I am a box</div>
    <!-- Multiple class-->
    <div class="box box2">I am another box</div>

    <script src="" async defer></script>
  </body>
</html>
