<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline Event handling -->
    <!-- <button onclick = "console.log('button was clicked'); alert('hello!')">Click Me</button> -->
    <!-- This is called Events handling. -->

    <button id = "btn1">btn1</button>

    <button ondblclick = "console.log('button was clicked 2x'); alert('hello!')">Click Me 2 times</button>
    <!-- ondblclick means event occurs when the button is double clicked. -->

    <!-- <div onmouseover = "console.log('You are inside div')">
        This is a box element
    </div> -->

    <div>This is a box element</div>
    <script src = "script.js"></script>
</body>
</html>
