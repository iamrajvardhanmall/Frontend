<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>ID and Classes</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- ID is unique -->
        <div id="red" class="red">First1</div>
        <div id="blue">Second1</div>
        
        <!-- Class is not unique. All they are used for styling multiple elements-->
        <div class="red">First2</div>
        <span class="red">Second2</span>
        <div class="red bg-blue">Third2</div> <!-- Giving multiple classes to the same element -->

        <!-- NOTE: Id and class are attributes of elements -->
        <!-- NOTE: We can use multiple classes to the same element -->
        <!-- NOTE: We can also use id to make link -->

        <script src="" async defer></script>
    </body>
</html>
