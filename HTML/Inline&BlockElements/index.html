<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Inline and Block elements</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Inline element -->
    <a href="https://www.google.com">Google</a>
    <span> I'm an inline element.</span>
    <!-- Span is similr to div -->

    <!-- Block element -->
    <p>Hello, I'm an inline element.</p>
    <div>I am a block element.</div>

    <!-- We can change inline and block elements using display property -->
    <script src="" async defer></script>
  </body>
</html>

<!--
    Block Elements List:
    <div>: A generic container for flow content.
    <h1> - <h6>: Heading elements.
    <p>: A paragraph.
    <ul>: Unordered list.
    <ol>: Ordered list.
    <li>: List item.
    <table>: A table.
    <form>: A section contaning from controls.
    <section>: A section in a document.
    <header>: A container for introductory content or a set of navigational links.
    <footer>: A container for information about the document, such as copyright notices.
    <nav>: A container for navigation links.
    <article>: A self-contained composition in a document, such as a section, article, or chapter.
    <aside>: A content aside from the content (like a sidebar).
    <main>: The main content of a document.
    <fieldset>: A set of form controls grouped under a common name.
    <bloackquote>: A section that contains quoted text.
    <pre>: Preformatted text.
    <canvas>: A container used to draw graphics via Javascript.
    <dl>: Description list.
    <dt>: A term/name in a description list.
    <dd>: A description of a term/name in a description list.
    <figure>: Anu content that refrenced from the main content.
    <figcaption>: A caption for a <figure> or <img> element.
    <address>: An address for the content.
    <hr>: A thematic break in an HTML page.
    <tfool>: A footer for the content.
    <mark>: Marks text with a background color.
    <img>: An image.
    and more...

    
    Inline Elements List:
    <a>: A hyperlink.
        <abbr>: An abbreviation or acronym.
        <b>: Bold text.
        <strong>: Important text.
        <em>: Emphasized text.
        <i>: Italic text.
        <mark>: Marked/highlighted text.
        <small>: Small text.
        <s>: Strikethrough text.
        <sub>: Subscript text.
        <sup>: Superscript text.
        <time>: A date/time.
        <u>: Underlined text.
        <wbr>: A word break opportunity.
    <span>: A generic inline container for flow content.
    <em>: Emphasized text.
        <del>: Deleted text.
        <ins>: Inserted text.
        <var>: Variable.    
    and more...

-->
